            <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Sorawit Komon - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container maintaining the exact graphic aspect ratio */
        .portfolio-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 Aspect Ratio */
            background-image: url('your-image.png'); /* Replace with your actual uploaded image filename */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Transparent interactive button base class */
        .invisible-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0); /* Completely transparent */
            border: none;
            cursor: pointer;
            outline: none;
            transition: background 0.2s ease-in-out;
        }

        /* Hover effect indicator (Optional: adjust alpha to 0.1 for a subtle hint, or leave 0 for fully hidden) */
        .invisible-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* --- EXACT COORDINATE PLACEMENTS --- */
        
        /* 1. เป้าหมาย & ความฝัน (Goals & Dreams) */
        .btn-goals {
            top: 5.5%;
            left: 55.2%;
            width: 21.0%;
            height: 11.2%;
            border-radius: 4px;
        }

        /* 2. ข้อมูลส่วนตัว (Personal Info) */
        .btn-info {
            top: 25.8%;
            left: 45.4%;
            width: 21.0%;
            height: 11.2%;
            border-radius: 4px;
        }

        /* 3. ผลการเรียน (Academic Records) */
        .btn-grades {
            top: 46.2%;
            left: 45.4%;
            width: 21.0%;
            height: 11.2%;
            border-radius: 4px;
        }

        /* 4. กิจกรรม & ผลงาน (Activities & Works) */
        .btn-activities {
            top: 66.5%;
            left: 54.5%;
            width: 21.8%;
            height: 11.2%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="portfolio-container">
        <!-- Replace href="#" with your specific subpage links or external URLs -->
        
        <!-- Button 1: เป้าหมาย & ความฝัน -->
        <a href="goals.html" class="invisible-btn btn-goals" title="เป้าหมาย & ความฝัน"></a>

        <!-- Button 2: ข้อมูลส่วนตัว -->
        <a href="about.html" class="invisible-btn btn-info" title="ข้อมูลส่วนตัว"></a>

        <!-- Button 3: ผลการเรียน -->
        <a href="grades.html" class="invisible-btn btn-grades" title="ผลการเรียน"></a>

        <!-- Button 4: กิจกรรม & ผลงาน -->
        <a href="activities.html" class="invisible-btn btn-activities" title="กิจกรรม & ผลงาน"></a>
    </div>

</body>
</html>
