<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ประวัติการเรียน - Sorawit Komon</title>
    <style>
        body {
            background-color: #dcedc8;
            color: #4e342e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 700px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-bottom: 30px; }
        .info-box {
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 40px;
            text-align: left;
            display: inline-block;
        }
        .grade-section {
            width: 100%;
            margin-top: 20px;
        }
        .grade-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .grade-card {
            border: 2px dashed #4e342e;
            padding: 20px;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.3);
        }
        .grade-img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-top: 10px;
        }
        .back-btn {
            margin-top: 4px;
            display: inline-block;
            background-color: #4e342e;
            color: #dcedc8;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>ประวัติการเรียน</h1>
        
        <div class="info-box">
            <p><strong>โรงเรียนประถมศึกษา :</strong> ผดุงราษฎร์</p>
            <p><strong>โรงเรียนมัธยมศึกษา :</strong> บ้านบึง "อุตสาหกรรมนุเคราะห์"</p>
        </div>

        <div class="grade-section">
            <h2>ใบเกรดสะสม (ม.4 - ม.5)</h2>
            <div class="grade-container">
                <!-- ช่องใส่ใบเกรด ม.4 -->
                <div class="grade-card">
                    <h3>ชั้นมัธยมศึกษาปีที่ 4</h3>
                    <!-- เปลี่ยน path รูปภาพใน src เมื่อมีไฟล์รูปภาพเกรด -->
                    <img src="path_to_grade4_image.jpg" alt="ใบเกรด ม.4 เทอม 1" class="grade-img" onerror="this.src='https://placehold.co'">
                    <img src="path_to_grade6_image.jpg" alt="ใบเกรด ม.4 เทอม 2" class="grade-img" onerror="this.src='https://placehold.co'">
                </div>
                <!-- ช่องใส่ใบเกรด ม.5 -->
                <div class="grade-card">
                    <h3>ชั้นมัธยมศึกษาปีที่ 5</h3>
                    <img src="path_to_grade5_image.jpg" alt="ใบเกรด ม.5 เทอม 1" class="grade-img" onerror="this.src='https://placehold.co'">
                    <img src="path_to_grade6_image.jpg" alt="ใบเกรด ม.5 เทอม 2" class="grade-img" onerror="this.src='https://placehold.co'">
                </div>
                <!-- ช่องใส่ใบเกรด ม.6 -->
                <div class="grade-card">
                    <h3>ชั้นมัธยมศึกษาปีที่ 6</h3>
                    <img src="path_to_grade6_image.jpg" alt="ใบเกรด ม.6 เทอม 1" class="grade-img" onerror="this.src='https://placehold.co'">
                    <img src="path_to_grade6_image.jpg" alt="ใบเกรด ม.6 เทอม 2" class="grade-img" onerror="this.src='https://placehold.co'">
                </div>
            </div>
        </div>

        <br><br>
        <a href="index.html" class="back-btn">กลับหน้าแรก</a>
    </div>

</body>
</html>
